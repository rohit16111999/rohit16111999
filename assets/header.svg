<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title description">
  <title id="title">Rohit Motdhare — AI Engineer</title>
  <desc id="description">Professional blue, purple, and cyan banner for AI Engineer Rohit Motdhare.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.52" stop-color="#121936"/>
      <stop offset="1" stop-color="#0C1830"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="shape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#7DD3FC" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="250" rx="20" fill="url(#background)"/>
  <rect width="1200" height="250" rx="20" fill="url(#grid)"/>
  <rect x="54" y="48" width="6" height="154" rx="3" fill="url(#accent)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M930 42 L1127 42 L1171 86 L1171 178" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="2"/>
    <path d="M969 208 L1085 208 L1133 160" stroke="#A78BFA" stroke-opacity="0.28" stroke-width="2"/>
    <circle cx="930" cy="42" r="5" fill="#38BDF8" stroke="none"/>
    <circle cx="969" cy="208" r="5" fill="#A78BFA" stroke="none"/>
    <circle cx="1133" cy="160" r="5" fill="#22D3EE" stroke="none"/>
  </g>

  <path d="M1006 68 L1108 68 L1159 119 L1108 170 L1006 170 L955 119 Z" fill="url(#shape)" stroke="#818CF8" stroke-opacity="0.24" stroke-width="2"/>
  <path d="M1041 93 L1091 93 L1116 119 L1091 145 L1041 145 L1016 119 Z" fill="none" stroke="#67E8F9" stroke-opacity="0.38" stroke-width="2"/>

  <text x="88" y="94" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="3">ROHIT MOTDHARE</text>
  <text x="90" y="139" fill="#67E8F9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" letter-spacing="5">AI ENGINEER</text>
  <rect x="90" y="158" width="680" height="2" rx="1" fill="url(#accent)" opacity="0.85"/>
  <text x="90" y="190" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="450" letter-spacing="0.8">Agentic AI · Backend Systems · Distributed Systems · Data Infrastructure</text>
</svg>
